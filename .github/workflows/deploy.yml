name: CI/CD — De Par en Par

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Tests y Build (dev / main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias (raíz, client y server)
        run: |
          npm ci
          npm --prefix client ci
          npm --prefix server ci

      - name: Ejecutar tests del backend
        run: npm --prefix server test

      - name: Construir cliente + medios y validar bundle del Worker
        run: |
          npm run build:cf
          npx wrangler deploy --dry-run

  deploy:
    name: Despliegue a Producción (Cloudflare)
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias de build y Wrangler
        run: |
          npm ci
          npm --prefix client ci

      - name: Construir aplicación y medios estáticos
        run: npm run build:cf

      - name: Asegurar esquema en Cloudflare D1 (sin sobrescribir datos)
        run: npx wrangler d1 execute de-par-en-par-db --remote --file=worker/schema.sql

      - name: Desplegar Worker y Assets en Cloudflare
        run: npx wrangler deploy
